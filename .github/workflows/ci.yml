name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - run: npm run build
        env:
          # Dummy value: db/index.ts reads DATABASE_URL at import time, so the build
          # needs *a* value. No real secret in CI; nothing connects to this at build.
          DATABASE_URL: postgresql://user:pass@localhost/db
