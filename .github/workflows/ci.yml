name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - run: npm run build
        env:
          # Dummy value: db/index.ts reads DATABASE_URL at import time, so the build
          # needs *a* value. No real secret in CI; nothing connects to this at build.
          DATABASE_URL: postgresql://user:pass@localhost/db

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Playwright builds and starts the app itself (see webServer in playwright.config.ts),
      # pointing it at the e2e database only. Fork PRs get no secrets, so this job fails there.
      - run: npm run e2e
        env:
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
